# Next sends prerendered pages with only `s-maxage` (meant for a CDN): browsers are told to revalidate them instead (cheap, with the ETag),
# so a reload always gets the current build. Hashed assets and every other Cache-Control pass unchanged.
map $upstream_http_cache_control $browser_cache_control {
    "~^s-maxage=[0-9]+(, *stale-while-revalidate(=[0-9]+)?)?$" "no-cache";
    default $upstream_http_cache_control;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /static/ {
        alias /vol/web/static/;
    }

    location ~ ^/(api/(v1|docs|schema)(/|$)|admin(/|$)|health(/|$)|media(/|$)) {
        proxy_pass http://app:8000;
    }

    # The deal inbox's websocket. A location that sets headers inherits none from the server block, hence the repeated ones.
    location /ws/ {
        proxy_pass http://realtime:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $browser_cache_control always;
    }
}

# The development tunnel (ngrok, see README "WhatsApp en desarrollo"): only what a phone and Meta's webhook need. The admin, the API docs and
# Django's own routes stay private (only the WhatsApp webhook and media pass), and their server errors get a plain page instead of the
# debug one, since the local app runs with DJANGO_DEBUG=1.
server {
    listen 80;
    server_name impish-divisive-mooing.ngrok-free.dev;
    client_max_body_size 12m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;

    location /static/ {
        alias /vol/web/static/;
    }

    location = /api/v1/whatsapp/webhook/ {
        proxy_pass http://app:8000;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @unavailable;
    }

    location /media/ {
        proxy_pass http://app:8000;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @unavailable;
    }

    location ~ ^/(api/(v1|docs|schema)(/|$)|admin(/|$)|administracion(/|$)|health(/|$)) {
        return 404;
    }

    location /ws/ {
        proxy_pass http://realtime:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $browser_cache_control always;
    }

    location @unavailable {
        default_type text/plain;
        return 503 "MotionPartes no está disponible en este momento.";
    }
}
