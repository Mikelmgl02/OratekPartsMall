name: ${COMPOSE_PROJECT_NAME:-partsmall}

services:
  db:
    image: postgres:15
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partsmall}
      POSTGRES_USER: ${POSTGRES_USER:-partsmall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: America/Panama
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment: &api_environment
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},app
      POSTGRES_DB: ${POSTGRES_DB:-partsmall}
      POSTGRES_USER: ${POSTGRES_USER:-partsmall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      STATIC_ROOT: /vol/web/static
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GEM_API_KEY:-}}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      APIAG_TOKEN_KEYS: ${APIAG_TOKEN_KEYS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-MotionPartes}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      WHATSAPP_TEMPLATE_UPDATE: ${WHATSAPP_TEMPLATE_UPDATE:-motionpartes_novedad_orden}
      WHATSAPP_TEMPLATE_MESSAGE: ${WHATSAPP_TEMPLATE_MESSAGE:-motionpartes_mensaje_nuevo}
      WHATSAPP_TEMPLATE_CODE: ${WHATSAPP_TEMPLATE_CODE:-motionpartes_codigo}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-507}
      # Carries the deal inbox's websocket nudges from the web workers to the realtime service; empty turns them off.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Quotation assistant: dark until QUOTE_ASSISTANT_MONTHLY_USD > 0. Token prices are placeholders; set them from Google's price sheet.
      QUOTE_ASSISTANT_MONTHLY_USD: ${QUOTE_ASSISTANT_MONTHLY_USD:-0}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-200}
      # The WhatsApp shopping assistant's monthly Gemini cap; 0 turns it off.
      WHATSAPP_ASSISTANT_MONTHLY_USD: ${WHATSAPP_ASSISTANT_MONTHLY_USD:-10}
      # Revisión IA of Productos nuevos: its monthly Gemini cap; 0 turns it off.
      SKU_REVIEW_MONTHLY_USD: ${SKU_REVIEW_MONTHLY_USD:-10}
      QUOTE_ASSISTANT_RUNS_PER_REVISION: ${QUOTE_ASSISTANT_RUNS_PER_REVISION:-5}
      QUOTE_ASSISTANT_DAILY_RUNS_PER_ACCOUNT: ${QUOTE_ASSISTANT_DAILY_RUNS_PER_ACCOUNT:-30}
      GEMINI_INPUT_USD_PER_MTOK: ${GEMINI_INPUT_USD_PER_MTOK:-1.00}
      GEMINI_OUTPUT_USD_PER_MTOK: ${GEMINI_OUTPUT_USD_PER_MTOK:-5.00}
      GEMINI_GROUNDING_USD_PER_CALL: ${GEMINI_GROUNDING_USD_PER_CALL:-0.035}
      # Quotations are published only from the supplier-reviewed draft; 0 re-opens the draftless legacy API path.
      QUOTES_REQUIRE_DRAFT: ${QUOTES_REQUIRE_DRAFT:-1}
      # 1 runs the OEM finder dry run (review queue only, never renames) as a matching worker stage after catalog grouping.
      # Keep it 0: the review queue has no screen since the owner retired OEM linking on 2026-10-14.
      OEM_FINDER_AUTO_STAGE: ${OEM_FINDER_AUTO_STAGE:-0}
      # 1 marks OEM, on every matching pass, the SKUs whose code is a declared or verified number of the OEM list (Biblioteca OEM).
      # Off by default since the owner retired OEM linking on 2026-10-14.
      OEM_EXACT_MARK: ${OEM_EXACT_MARK:-0}
      # 1 sends a supplier item no code ties to a SKU to Productos nuevos (owner decision D1); its description words stay hints.
      MATCHING_NO_CODE_EVIDENCE: ${MATCHING_NO_CODE_EVIDENCE:-0}
      # What the storefront search reads (inventory refactor S7): legacy until the Search Document's counts verify, then document.
      CATALOG_SEARCH_SOURCE: ${CATALOG_SEARCH_SOURCE:-legacy}
      # The matching worker rebuilds every Search Document this often (hours; 0 turns it off).
      SEARCH_DOCUMENT_REBUILD_HOURS: ${SEARCH_DOCUMENT_REBUILD_HOURS:-6}
      CATALOG_LOW_STOCK_THRESHOLD: ${CATALOG_LOW_STOCK_THRESHOLD:-5}
      CATALOG_HIGH_STOCK_THRESHOLD: ${CATALOG_HIGH_STOCK_THRESHOLD:-20}
      DO_SPACES_KEY: ${DO_SPACES_KEY:-}
      DO_SPACES_SECRET: ${DO_SPACES_SECRET:-}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:-}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-nyc3}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-}
      DO_SPACES_CDN_ENABLED: ${DO_SPACES_CDN_ENABLED:-true}
      DO_SPACES_CDN_ENDPOINT: ${DO_SPACES_CDN_ENDPOINT:-}
      DO_SPACES_MEDIA_PREFIX: ${DO_SPACES_MEDIA_PREFIX:-motionpartes/media}
      # Chat files: private on Spaces when configured, or local (the app's disk); local keeps development off the shared bucket.
      CHAT_MEDIA_STORAGE: ${CHAT_MEDIA_STORAGE:-}
      CHAT_TRANSCRIPTION: ${CHAT_TRANSCRIPTION:-1}
    volumes:
      - .:/app
      - staticfiles:/vol/web/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': 'localhost'}), timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  matching:
    image: ${COMPOSE_PROJECT_NAME:-partsmall}-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "mall.matching_runner"]
    environment: *api_environment
    # SIGTERM lets the pass finish its stage, give its lease back and exit (mall.matching_runner); after this, Docker kills it. Above
    # the AI request (90 s timeout) that may be in flight, plus the notifications the runner waits for at exit.
    stop_grace_period: 120s
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
        restart: true  # long-running: recreated with app, so it never runs code older than the migrated database
    healthcheck:
      # Fails when the worker loop has not completed a pass or a query for MATCHING_HEARTBEAT_MAX_AGE (600 s).
      test: ["CMD", "python", "-m", "mall.matching_runner", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  apiag-sync:
    # Pulls each supplier's apiag-cloud into their inventory (mall.apiag_sync), one pull at a time.
    image: ${COMPOSE_PROJECT_NAME:-partsmall}-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "mall.apiag_sync_runner"]
    environment: *api_environment
    stop_grace_period: 60s  # SIGTERM: the pull stops after its current page and gives its lease back
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
        restart: true  # long-running: recreated with app, so it never runs code older than the migrated database
    healthcheck:
      test: ["CMD", "python", "-m", "mall.apiag_sync_runner", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  quote-holds:
    # Frees the stock of sent quotations whose hold lapsed while the client decided (mall.stock_reservations.expire_due).
    image: ${COMPOSE_PROJECT_NAME:-partsmall}-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "mall.quote_holds_runner"]
    environment: *api_environment
    stop_grace_period: 60s  # SIGTERM: the pass finishes the order it is releasing and its notices go out, then the runner exits
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
        restart: true  # long-running: recreated with app, so it never runs code older than the migrated database
    healthcheck:
      test: ["CMD", "python", "-m", "mall.quote_holds_runner", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Only the inbox's websocket nudges go through it: nothing to keep across restarts.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # The deal inbox's websocket (/ws/inbox/, config.asgi on daphne). It runs no migrations: the app service does.
  realtime:
    image: ${COMPOSE_PROJECT_NAME:-partsmall}-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "--proxy-headers", "config.asgi:application"]
    environment: *api_environment
    volumes:
      - .:/app
    depends_on:
      app:
        condition: service_healthy
        restart: true  # long-running: recreated with app, so it never runs code older than the migrated database
      redis:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      secrets:
        - ag_grid_env
    environment:
      API_INTERNAL_URL: http://app:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      MOTIONPARTES_DEV_TOOLS: ${MOTIONPARTES_DEV_TOOLS:-0}  # 1: dev-only pages such as /diagramas
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${API_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/vol/web/static:ro
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

secrets:
  ag_grid_env:
    file: .env

volumes:
  db_data:
  staticfiles:
